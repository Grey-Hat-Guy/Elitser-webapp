<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careers | Elitser Group</title>

    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/careers.css" />
  </head>
  <body>
    <div id="header"></div>

    <main>
      <section class="careers-hero">
        <div class="container">
          <span class="careers-eyebrow">CAREERS AT ELITSER</span>
          <h1>Build Your Future With Us</h1>
          <p>
            Explore opportunities to grow your career, work with talented
            people, and make an impact through technology.
          </p>
        </div>
      </section>

      <section class="careers-section">
        <div class="container">
          <div class="careers-heading">
            <div>
              <span class="careers-eyebrow">OPPORTUNITIES</span>
              <h2>Current Openings</h2>
              <p>Find a role that matches your skills and ambitions.</p>
            </div>
          </div>

          <div id="jobsContainer" class="jobs-container">
            <div class="jobs-loading">
              <div
                class="sk-circle"
                aria-label="Loading vacancies"
                role="status"
              >
                <div class="sk-circle1 sk-child"></div>
                <div class="sk-circle2 sk-child"></div>
                <div class="sk-circle3 sk-child"></div>
                <div class="sk-circle4 sk-child"></div>
                <div class="sk-circle5 sk-child"></div>
                <div class="sk-circle6 sk-child"></div>
                <div class="sk-circle7 sk-child"></div>
                <div class="sk-circle8 sk-child"></div>
                <div class="sk-circle9 sk-child"></div>
                <div class="sk-circle10 sk-child"></div>
                <div class="sk-circle11 sk-child"></div>
                <div class="sk-circle12 sk-child"></div>
              </div>
              <p>Loading available positions...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>
    <div id="scrollTop"></div>

    <script src="/js/loadComponents.js"></script>
    <script type="module" src="/js/careers.js"></script>
  </body>
</html>
