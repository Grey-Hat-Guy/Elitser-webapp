<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Elitser</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body>
    <main class="login-container">
      <section class="login-card">
        <div class="brand">
          <h1>ELITSER</h1>
          <p>Careers Administration</p>
        </div>

        <div class="login-heading">
          <h2>Welcome back</h2>
          <p>Sign in to manage career opportunities.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <p id="loginMessage" class="message" role="alert"></p>

          <button type="submit" id="loginButton" class="login-button">
            <span class="button-text">Sign In</span>
            <span class="login-loader" id="loginLoader" hidden>
              <span class="lds-ripple">
                <span></span>
                <span></span>
              </span>
            </span>
          </button>
        </form>

        <p class="login-footer">Elitser Careers Admin Portal</p>
      </section>
    </main>

    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
